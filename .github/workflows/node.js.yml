# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
- name: OpenInfraQuote
  # You may pin to the exact commit or the version.
  # uses: terrateamio/openinfraquote-action@6ce7f258c71e3104b75ca438a731c4f6d45d4593
  uses: terrateamio/openinfraquote-action@v1
  with:
    # Path to the Terraform JSON plan file
    plan-path: # optional, default is tfplan.json
    # Whether to comment the result on the pull request
    comment-on-pr: # optional, default is true
    # GitHub token for commenting on pull requests
    github-token: # optional, default is ${{ github.token }}
    # Optional region for oiq price
    region: # optional, default is 
    - name: Code Engine GitHub Action
  # You may pin to the exact commit or the version.
  # uses: IBM/code-engine-github-action@397f52bce0731f3c134a3d6ad0d2d8c0f1867a01
  uses: IBM/code-engine-github-action@v1.3.1
  with:
    # IAM API Key used to log into the IBM Cloud
    api-key: 
    # An IBM Cloud Resource Group is a logical container used to organize and manage related cloud resources
    resource-group: # optional
    # The Region refers to a geographical area where the project is are located
    region: 
    # A Code Engine Project Is the grouping of your Apps, Functions and Jobs
    project: 
    # The type of component that should be deployed [App, Function, Job, Build]
    component: 
    # Name of the App, Function, Job or build
    name: 
    # Runtime used for the Function only required for function
    runtime: # optional
    # Name of the image that is used for this application
    image: # optional
    # Name of the registry secret used to authenticate against the Container registry
    registry-secret: # optional
    # Port of the Application
    port: # optional
    # Enable trusted profiles
    trusted-profiles: # optional
    # path to the directory containing the source code
    build-source: # optional, default is .
    # strategy used for building the image ['dockerfile', 'buildpacks']
    build-strategy: # optional, default is buildpacks
    # The size to use for the build, which determines the amount of resources used. Valid values include small, medium, large, xlarge, and xxlarge.
    build-size: # optional, default is medium
    # CPU configuration set for the component. If not set default Code Engine values are used.
    cpu: # optional
    # Memory configuration set for the component. If not set default Code Engine values are used.
    memory: # optional 
    - name: Deploy a Deploy Request
  # You may pin to the exact commit or the version.
  # uses: planetscale/deploy-deploy-request-action@ddb9d1c593391e6d1601d97e8aa44e3d4ea302f9
  uses: planetscale/deploy-deploy-request-action@v4
  with:
    # The name of the database.
    database_name: 
    # The number of the deploy request to deploy. Defaults to the latest deploy request.
    number: # optional
    # The name of the organization that owns the database.
    org_name: 
    # If set to `true`, this action will wait for the deploy request to merge before exiting.
    wait: # optional - name: Setup Buildless
  # You may pin to the exact commit or the version.
  # uses: buildless/setup@30e82389418c7f17046606183bc4c78b2c8913e0
  uses: buildless/setup@v1.0.2
  with:
    # Version
    version: # optional, default is latest
    # OS
    os: # optional
    # Architecture
    arch: # optional
    # Custom install path
    target: # optional
    # Force install
    force: # optional
    # Export to Path
    export_path: # optional, default is true
    # Custom Download URL
    custom_url: # optional
    # GitHub Token
    token: # optional, default is ${{ github.token }}
    # Enable Buildless Agent
    agent: # optional, default is true
    # Buildless API key
    apikey: # optional
    # Buildless Tenant
    tenant: # optional
    # Buildless Project
    project: # optional
